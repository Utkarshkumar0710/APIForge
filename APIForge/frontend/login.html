<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — APIForge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-heading">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in to your workspace.</h1>
        <p>Secure access to your API key, usage insights, and live requests.</p>
      </div>
      <form id="login-form" class="auth-form">
        <label>Email
          <input name="email" type="email" placeholder="you@example.com" required />
        </label>
        <label>Password
          <div class="password-row">
            <input name="password" type="password" placeholder="Your password" required />
            <button type="button" class="ghost-btn" data-show-password="[name='password']">Show</button>
          </div>
        </label>
        <div id="form-message" class="form-message"></div>
        <button class="button button-primary" type="submit">Sign In</button>
      </form>
      <p class="auth-switch">Need an account? <a href="/register.html">Create one</a></p>
    </div>
  </div>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
